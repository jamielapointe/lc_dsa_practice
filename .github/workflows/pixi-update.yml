name: Pixi Dependency Update

on:
  schedule:
    # Runs every Monday at 04:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dependencies:
    name: Update Pixi Lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.83.0
          cache: true

      - name: Update Lockfile and Capture Diff
        id: pixi-update
        uses: pavelzw/pixi-diff-to-markdown@f86919f8f9fc46399cb514554e3258ca1d540109 # v0.3.11
        with:
          commit-changes: false

      - name: Create Pull Request
        if: steps.pixi-update.outputs.diff != ''
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): update pixi dependencies"
          title: "chore(deps): update pixi dependencies"
          body: |
            ### Pixi Dependency Updates

            Automated weekly lockfile update generated by `.github/workflows/pixi-update.yml`.

            ${{ steps.pixi-update.outputs.markdown }}
          branch: pixi-updates
          delete-branch: true
