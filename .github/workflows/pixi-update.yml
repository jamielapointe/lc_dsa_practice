name: Pixi Dependency Update

on:
  schedule:
    # Runs every Monday at 04:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-dependencies:
    name: Update Pixi Lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # Push updated lockfile branch for PR creation
      pull-requests: write # Create and update dependency update PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.84.2
          cache: true

      - name: Update Lockfile and Capture Diff
        id: pixi-update
        uses: pavelzw/pixi-diff-to-markdown@f86919f8f9fc46399cb514554e3258ca1d540109 # v0.3.11
        with:
          commit-changes: false

      - name: Create Pull Request
        if: steps.pixi-update.outputs.diff != ''
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): update pixi dependencies"
          title: "chore(deps): update pixi dependencies"
          body: |
            ### Pixi Dependency Updates

            Automated weekly lockfile update generated by `.github/workflows/pixi-update.yml`.

            ${{ steps.pixi-update.outputs.markdown }}
          branch: pixi-updates
          delete-branch: true
