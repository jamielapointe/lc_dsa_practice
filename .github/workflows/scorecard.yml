name: OpenSSF Scorecard

on:
  schedule:
    # Weekly audit on Monday at 04:00 UTC
    - cron: '0 4 * * 1'
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: Scorecard Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # Upload SARIF results to GitHub Code Scanning
      id-token: write # Mint OIDC token for OpenSSF Scorecard attestation
      contents: read # Inspect repository files and metadata
      actions: read # Audit GitHub Actions workflow configurations
      issues: read # Check repository issue activity metrics
      pull-requests: read # Check PR review and branch protection metrics
      checks: read # Inspect CI check status history
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard analysis
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
