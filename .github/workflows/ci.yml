name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint-and-hygiene:
    name: Lint & Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.84.2
          cache: true

      - name: Run pre-commit hooks
        env:
          SKIP: no-commit-to-branch
        run: pixi run pre-commit --show-diff-on-failure

      - name: Run dependency and vulnerability audit
        run: pixi run audit

      - name: Check Marimo notebooks
        run: |
          pixi run notebook-check
          pixi run python notebooks/benchmark_telemetry_explorer.py
          pixi run pytest notebooks/benchmark_telemetry_explorer.py -v

  python-tests:
    name: Python Tests (${{ matrix.os }})
    needs: lint-and-hygiene
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.84.2
          cache: true

      - name: Run Python test suite with coverage (>= 85% gate in pyproject.toml)
        run: pixi run cov-python

      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-coverage
          path: coverage.xml
          if-no-files-found: error

  cpp-tests:
    name: C++ Tests (${{ matrix.os }})
    needs: lint-and-hygiene
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.84.2
          cache: true

      - name: Configure, build, and test (release)
        run: pixi run cpp-release

  cpp-coverage:
    name: C++ Coverage (ubuntu-latest)
    needs: lint-and-hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.84.2
          cache: true

      - name: Build, test, and enforce C++ line coverage (>= 85%)
        run: pixi run cov-cpp

  sanitizers:
    name: Sanitizers (${{ matrix.preset }})
    needs: lint-and-hygiene
    strategy:
      fail-fast: false
      matrix:
        preset:
          - asan
          - ubsan
          - tsan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.84.2
          cache: true

      - name: Run ${{ matrix.preset }} workflow
        env:
          PRESET: ${{ matrix.preset }}
        run: pixi run cmake --workflow --preset "$PRESET"

  rust-tests:
    name: Rust Tests (${{ matrix.os }})
    needs: lint-and-hygiene
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.84.2
          cache: true

      - name: Run Rust test suite
        run: pixi run test-rust

  rust-coverage:
    name: Rust Coverage (ubuntu-latest)
    needs: lint-and-hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.84.2
          cache: true

      - name: Build, test, and enforce Rust line coverage (>= 85%)
        run: pixi run cov-rust --lcov --output-path lcov.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-coverage
          path: lcov.info
          if-no-files-found: error

  crubit-interop:
    name: Crubit Interop (${{ matrix.os }})
    needs: lint-and-hygiene
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.84.2
          cache: true

      - name: Cache Crubit toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/crubit
          key: crubit-${{ runner.os }}-b7805b5d09574033ec3144d59715a539a4f652b0-${{ hashFiles('scripts/crubit/bootstrap_crubit.py', 'pixi.toml', 'pyproject.toml') }}

      - name: Bootstrap Crubit toolchain
        run: pixi run crubit-bootstrap

      - name: Build and test Crubit interop (Debug)
        run: pixi run test-interop

      - name: Run Crubit interop showcase examples (Debug)
        run: pixi run python scripts/examples/run_crubit_examples.py --preset interop-debug

      - name: Build and test Crubit interop (Release)
        run: pixi run interop-release

      - name: Run Clippy on Crubit interop crates
        run: pixi run clippy-interop
