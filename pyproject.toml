[project]
name = "lc-dsa-practice"
version = "0.1.0"
description = "Multi-language LeetCode / DSA & systems engineering practice (C++23, C23, Python 3.15, Rust 1.100+, Crubit)"
readme = "README.md"
requires-python = ">=3.15"
authors = [
  { name = "Jamie LaPointe", email = "jamielapointe@google.com" },
]
dependencies = [
  "arviz-base>=1.3.1",
  "arviz-stats>=1.3.3",
  "cyclopts>=5.5.0",
  "httpx>=0.28.1",
  "markdownify>=1.2.3",
  "mcp>=2.3.0",
  "numpy>=2.5.4",
  "plotly>=7.1.0",
  "polars>=2.1.0",
  "pydantic>=2.14.3",
  "pyyaml>=6.0.3",
  "scipy>=1.18.1",
  "structlog>=26.1.0",
]

[dependency-groups]
dev = [
  "prek>=0.5.10",
  { include-group = "lint" },
  { include-group = "security" },
  { include-group = "test" },
  { include-group = "typecheck" },
]
lint = [
  "gersemi>=0.29.2",
  "marimo>=0.25.2",
  "ruff>=0.17.5",
  "rumdl>=0.3.4",
  "tombi>=1.11.2",
]
security = [
  "deptry>=0.25.1",
  "pip-audit>=2.10.1",
  "zizmor>=1.32.0",
]
test = [
  "hypothesis>=6.170.15",
  "pytest>=9.2.0",
  "pytest-asyncio>=1.5.0",
  "pytest-cov>=7.1.0",
  "pytest-randomly>=5.1.0",
  "pytest-timeout>=2.4.0",
]
typecheck = [
  "basedpyright>=1.40.2",
  "scipy-stubs>=1.18.1.1",
  "ty>=0.0.104",
  "types-pyyaml>=6.0.12.20261113",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.basedpyright]
include = [
  "src/python",
  ".agents/plugins/leetcode/src",
  ".agents/plugins/leetcode/tests",
  "scripts",
  "test/python",
  "notebooks",
]
extraPaths = [
  ".",
  "src/python",
  ".agents/plugins/leetcode/src",
]
pythonVersion = "3.15"
typeCheckingMode = "strict"
reportImplicitOverride = true
reportMissingTypeStubs = "warning"
reportUnusedCallResult = false

[[tool.basedpyright.executionEnvironments]]
root = "test/python"
extraPaths = [
  ".",
  "src/python",
]
reportPrivateUsage = false

[[tool.basedpyright.executionEnvironments]]
root = ".agents/plugins/leetcode/tests"
extraPaths = [
  ".agents/plugins/leetcode/src",
]
reportPrivateUsage = false

[tool.coverage.run]
branch = true
omit = [
  "*/.agents/plugins/leetcode/tests/*",
  "*/test/*",
]
source = [
  "src/python/leet_code",
  ".agents/plugins/leetcode/src/leetcode_mcp",
]

[tool.coverage.report]
exclude_also = [
  "def __repr__",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
fail_under = 85
show_missing = true

[tool.deptry]
extend_exclude = [
  "\\.agents/(scratch|swarm|teamwork|tmp|workflows)",
  "benchmarks",
  "build",
  "data",
  "dist",
  "docs",
  "examples",
  "src/(c|cpp|include|rust)",
  "test/(c|cpp|rust)",
]
known_first_party = [
  "leet_code",
  "leetcode_mcp",
  "scripts",
]

[tool.deptry.per_rule_ignores]
DEP004 = [
  "hypothesis",
  "marimo",
  "pytest",
]

[tool.pytest]
addopts = [
  "--import-mode=importlib",
  "-ra",
  "--doctest-modules",
  "--timeout=300",
  "-m",
  "not live",
]
filterwarnings = [
  "error",
]
markers = [
  "benchmark: performance tests",
  "integration: multi-component integration tests",
  "live: tests that make live network calls to the LeetCode GraphQL API (deselected by default)",
  "stress: stress and time-limit workloads",
  "unit: fast isolated unit tests",
]
minversion = "9.0"
pythonpath = [
  ".",
  ".agents/plugins/leetcode/src",
  "src/python",
]
strict = true
testpaths = [
  ".agents/plugins/leetcode/tests",
  "test/python",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
exclude = [
  ".agent",
  ".agents/scratch",
  ".agents/swarm",
  ".agents/teamwork",
  ".agents/tmp",
  ".agents/workflows",
  ".claude",
  ".codex",
  ".cursor",
  ".gemini",
  ".git",
  ".pixi",
  ".venv",
  ".windsurf",
  "_agent",
  "_agents",
  "build",
  "data",
  "dist",
]
line-length = 88
preview = true
src = [
  ".",
  ".agents/plugins/leetcode/src",
  "src/python",
]
target-version = "py315"

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
quote-style = "double"
skip-magic-trailing-comma = false

[tool.ruff.lint]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
select = [
  "E",
  "F",
  "W",
  "I",
  "N",
  "D",
  "DOC",
  "UP",
  "B",
  "SIM",
  "C4",
  "DTZ",
  "PT",
  "RUF",
  "PERF",
  "FURB",
  "S",
  "ANN",
  "ASYNC",
  "PTH",
  "TID",
  "TC",
  "PL",
]
# Ruff RUF201: use full rule names in ignore lists rather than raw codes.
ignore = [
  "line-too-long",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__.annotations".msg = "Python 3.14+ natively defers annotations via PEP 649/749 (annotationlib); remove 'from __future__ import annotations'."

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ruff.lint.per-file-ignores]
".agents/plugins/leetcode/src/leetcode_mcp/client.py" = [
  "docstring-extraneous-exception",
  "suspicious-non-cryptographic-random-usage",
]
".agents/plugins/leetcode/src/leetcode_mcp/server.py" = [
  "typing-only-first-party-import",
]
".agents/plugins/leetcode/tests/**" = [
  "assert",
  "docstring-missing-returns",
  "docstring-missing-yields",
  "magic-value-comparison",
  "no-self-use",
  "suspicious-non-cryptographic-random-usage",
  "typing-only-first-party-import",
  "undocumented-public-method",
]
"notebooks/**" = [
  "import-outside-top-level",
  "magic-value-comparison",
  "too-many-arguments",
  "too-many-locals",
  "too-many-statements",
  "used-dummy-variable",
  "useless-expression",
]
"scripts/**" = [
  "start-process-with-partial-path",
  "subprocess-without-shell-equals-true",
  "suspicious-subprocess-import",
]
"test/python/scripts/**" = [
  "start-process-with-partial-path",
  "subprocess-without-shell-equals-true",
  "suspicious-subprocess-import",
]
"test/**" = [
  "assert",
  "magic-value-comparison",
  "no-self-use",
  "suspicious-non-cryptographic-random-usage",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.rumdl]
exclude = [
  ".agent",
  ".agents/scratch",
  ".agents/swarm",
  ".agents/teamwork",
  ".agents/tmp",
  ".agents/workflows",
  ".claude",
  ".codex",
  ".cursor",
  ".gemini",
  ".git",
  ".pixi",
  ".venv",
  ".windsurf",
  "BRIEFING.md",
  "CLAUDE.md",
  "DISPATCH.md",
  "HANDOFF.md",
  "ORIGINAL_REQUEST.md",
  "PLAN.md",
  "PROGRESS.md",
  "PROJECT.md",
  "SCOPE.md",
  "TASK.md",
  "TEST_INFRA.md",
  "TEST_READY.md",
  "WALKTHROUGH.md",
  "_agent",
  "_agents",
  "build",
  "data",
  "dist",
  "handoff.md",
  "implementation_plan.md",
  "progress.md",
  "task.md",
  "walkthrough.md",
]
flavor = "gfm"
line-length = 160
respect-gitignore = true

[tool.rumdl.MD013]
code-blocks = false
headings = false
line-length = 160
math-blocks = false
reflow = true
tables = false

[tool.rumdl.MD033]
allowed-elements = [
  "a",
  "br",
  "details",
  "div",
  "img",
  "kbd",
  "p",
  "span",
  "sub",
  "summary",
  "sup",
]

[tool.ty.environment]
python-version = "3.15"
extra-paths = [
  ".",
  "src/python",
  ".agents/plugins/leetcode/src",
]

[tool.ty.src]
include = [
  "src/python",
  ".agents/plugins/leetcode/src",
  ".agents/plugins/leetcode/tests",
  "scripts",
  "test/python",
  "notebooks",
]

[tool.uv.build-backend]
module-root = "src/python"
module-name = "leet_code"
