[project]
name = "lc-dsa-practice"
version = "0.1.0"
description = "C++23 LeetCode DSA practice project featuring modular CMake, Google Test, and pre-commit checks"
requires-python = ">=3.12"
dependencies = [
    "pre-commit>=4.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "markdownify>=1.2.3",
    "mcp>=2.2.0",
    "mypy>=2.3.1",
    "pre-commit>=4.0.0",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[tool.uv]
managed = true
