[workspace]
name = "lc-dsa-practice"
version = "0.1.0"
description = "Multi-language LeetCode / DSA & systems engineering practice (C++23, C23, Python 3.15, Rust 1.99.1+, Crubit)"
authors = ["Jamie LaPointe <jamielapointe@google.com>"]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]
requires-pixi = ">=0.84.2"

[activation.env]
CARGO_TARGET_DIR = "$PIXI_PROJECT_ROOT/build/cargo"
CC = "$CONDA_PREFIX/bin/clang"
CCACHE_DIR = "$PIXI_PROJECT_ROOT/build/.ccache"
CXX = "$CONDA_PREFIX/bin/clang++"
LLVM_COV = "$CONDA_PREFIX/bin/llvm-cov"
LLVM_PROFDATA = "$CONDA_PREFIX/bin/llvm-profdata"
PYTHONPATH = "$PIXI_PROJECT_ROOT/src/python:$PIXI_PROJECT_ROOT/.agents/plugins/leetcode/src:$PIXI_PROJECT_ROOT"
RUST_SRC_PATH = "$CONDA_PREFIX/lib/rustlib/src/rust/library"

[dependencies]
python = ">=3.15,<3.16"
actionlint = ">=1.7.12"
benchmark = ">=1.10.0"
cargo-llvm-cov = ">=0.9.1"
ccache = ">=4.14.3"
clang = ">=23.1.5"
clang-tools = ">=23.1.5"
clangxx = ">=23.1.5"
cmake = ">=4.5.0"
compiler-rt = ">=23.1.5"
cyclopts = ">=5.5.0"
gtest = ">=1.18.0"
httpx = ">=0.28.1"
lld = ">=23.1.5"
llvm-tools = ">=23.1.5"
markdownify = ">=1.2.3"
mcp = ">=2.3.0"
ninja = ">=1.13.2"
numpy = ">=2.5.4"
plotly = ">=7.1.0"
polars = ">=2.1.0"
pydantic = ">=2.14.3"
pyyaml = ">=6.0.3"
rust = ">=1.100.0"
rust-src = ">=1.100.0"
scipy = ">=1.18.1"
structlog = ">=26.1.0"
tombi = ">=1.11.2"
uv = ">=0.13.8"
zizmor = ">=1.32.0"

[target.linux-64.dependencies]
libcxx = ">=23.1.5"
libcxx-devel = ">=23.1.5"
libcxxabi = ">=23.1.5"

[target.osx-arm64.dependencies]
libcxx = ">=23.1.5"
libcxx-devel = ">=23.1.5"

[pypi-dependencies]
lc-dsa-practice = { path = ".", editable = true }
arviz-base = ">=1.3.1"
arviz-stats = ">=1.3.3"
basedpyright = ">=1.40.2"
deptry = ">=0.25.1"
gersemi = ">=0.29.2"
hypothesis = ">=6.170.15"
marimo = ">=0.25.2"
pip-audit = ">=2.10.1"
prek = ">=0.5.10"
pytest = ">=9.2.0"
pytest-asyncio = ">=1.5.0"
pytest-cov = ">=7.1.0"
pytest-randomly = ">=5.1.0"
pytest-timeout = ">=2.4.0"
ruff = ">=0.17.5"
rumdl = ">=0.3.4"
scipy-stubs = ">=1.18.1.1"
ty = ">=0.0.104"
types-pyyaml = ">=6.0.12.20261113"

[tasks]
audit = "deptry . && pip-audit --skip-editable"
check-rust = "cargo check --workspace --all-targets"
check-traceability = "python scripts/ci/check_systems_traceability.py"
clippy = "cargo clippy --workspace --all-targets -- -D warnings"
clippy-fix = "cargo clippy --fix --allow-dirty --allow-staged --workspace --all-targets -- -D warnings"
clippy-interop = "python -c \"import json, pathlib, os, subprocess, sys; root = pathlib.Path('.'); env_file = root / 'build/crubit/crubit_env.json'; subprocess.run([sys.executable, 'scripts/crubit/bootstrap_crubit.py'], check=True) if not env_file.is_file() else None; data = json.loads(env_file.read_text()); env = os.environ | {'CARGO': data['CARGO'], 'RUSTC': data['RUSTC'], 'RUSTC_BOOTSTRAP': '1', 'PATH': data['PATH_PREPEND'] + os.pathsep + os.environ.get('PATH', '')}; build_dir = root / 'build/interop-debug'; find_patches = lambda: sorted(build_dir.rglob('crubit_rust_api/*/Cargo.toml')); (subprocess.run(['cmake', '--preset', 'interop-debug'], check=True), subprocess.run(['cmake', '--build', '--preset', 'interop-debug'], check=True)) if not find_patches() else None; patches = [f'patch.crates-io.{p.parent.name}.path={json.dumps(p.parent.resolve().as_posix())}' for p in find_patches()]; patch_args = [a for p in patches for a in ('--config', p)]; target_dir = str((build_dir / 'crubit_cargo').resolve()); manifests = [m for base in ('src/rust/interop', 'examples/interop', 'test/rust/interop') if (root / base).is_dir() for m in sorted((root / base).rglob('Cargo.toml')) if 'target' not in m.parts]; [subprocess.run([data['CARGO'], 'clippy', '--manifest-path', str(m), '--target-dir', target_dir, *patch_args, '--all-targets', '--', '-D', 'warnings'], env=env, check=True) for m in manifests]\""
cov-cpp = "cmake --workflow --preset coverage && python scripts/ci/cpp_coverage.py --build-dir build/coverage --fail-under 85"
cov-python = "pytest --cov --cov-report=term-missing --cov-report=xml"
cov-rust = "cargo llvm-cov --workspace --all-targets --fail-under-lines 85"
cpp-asan = "cmake --workflow --preset asan"
cpp-benchmark = "cmake --workflow --preset benchmark"
cpp-benchmark-build = "cmake --build --preset benchmark"
cpp-ci-debug = "cmake --workflow --preset ci-debug"
cpp-debug = "cmake --workflow --preset dev-debug"
cpp-debug-config = "cmake --preset dev-debug"
cpp-release = "cmake --workflow --preset dev-release"
cpp-tsan = "cmake --workflow --preset tsan"
cpp-ubsan = "cmake --workflow --preset ubsan"
crubit-bootstrap = "python scripts/crubit/bootstrap_crubit.py"
examples-interop = "python scripts/crubit/bootstrap_crubit.py && cmake --preset interop-debug && cmake --build --preset interop-debug && python scripts/examples/run_crubit_examples.py --preset interop-debug"
format = "ruff format"
format-check = "ruff format --check"
format-cmake = "gersemi -i CMakeLists.txt cmake src/cpp src/c test/cpp test/c test/rust/interop benchmarks/cpp benchmarks/c examples"
format-cmake-check = "gersemi --check CMakeLists.txt cmake src/cpp src/c test/cpp test/c test/rust/interop benchmarks/cpp benchmarks/c examples"
format-cpp = "cmake --build --preset dev-debug --target format"
format-cpp-check = "cmake --build --preset dev-debug --target format-check"
format-rust = "cargo fmt --all"
format-rust-check = "cargo fmt --all -- --check"
format-toml = "tombi format pyproject.toml pixi.toml Cargo.toml .cargo/config.toml rustfmt.toml clippy.toml"
format-toml-check = "tombi format --check pyproject.toml pixi.toml Cargo.toml .cargo/config.toml rustfmt.toml clippy.toml && tombi lint pyproject.toml pixi.toml Cargo.toml .cargo/config.toml rustfmt.toml clippy.toml"
interop-release = "python scripts/crubit/bootstrap_crubit.py && cmake --workflow --preset interop-release"
leetcode-mcp = "python -m leetcode_mcp"
lint = "ruff check"
lint-fix = "ruff check --fix --exit-non-zero-on-fix"
lint-md = "rumdl check ."
notebook-check = "marimo check --strict notebooks/"
pre-commit = "prek run --all-files"
shm-pubsub-example = "python scripts/examples/run_shm_pubsub_example.py"
test-cpp = "cmake --workflow --preset dev-debug"
test-interop = "python scripts/crubit/bootstrap_crubit.py && cmake --workflow --preset interop-debug"
test-python = "pytest"
test-rust = "cargo test --workspace --all-targets"
typecheck = "basedpyright && ty check"

[tasks.test]
depends-on = ["test-cpp", "test-python", "test-rust"]
