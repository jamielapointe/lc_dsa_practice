[package]
name = "crubit_showcase_rust_demo"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
authors = ["Jamie LaPointe <jamielapointe@google.com>"]
publish = false

[[bin]]
name = "crubit_showcase_rust_demo"
path = "src/main.rs"

[dependencies]
cc_ownership_raii = "0.1.0"
cc_primitives_enums = "0.1.0"
cc_references_views = "0.1.0"
cc_telemetry_bridge = "0.1.0"
cc_traits_errors = "0.1.0"
cref = { path = "../../../../../build/crubit/src/cargo/support/cref" }
ctor = { path = "../../../../../build/crubit/src/cargo/support/ctor" }
ffi_11 = { path = "../../../../../build/crubit/src/support/ffi_11" }
rs_telemetry_validator = { path = "../../../../../src/rust/interop/crubit/rs_telemetry_validator" }

[lints.clippy]
all = { level = "warn", priority = -1 }
borrowed_box = "warn"
cargo = { level = "warn", priority = -1 }
cast_lossless = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
clone_on_ref_ptr = "deny"
enum_glob_use = "deny"
expect_used = "warn"
len_without_is_empty = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
# `multiple_crate_versions` invokes `cargo metadata` without outer `--config patch.crates-io` flags.
multiple_crate_versions = "allow"
needless_pass_by_value = "warn"
new_without_default = "warn"
nursery = { level = "warn", priority = -1 }
panic = "deny"
pedantic = { level = "warn", priority = -1 }
ptr_arg = "warn"
should_implement_trait = "warn"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unwrap_used = "deny"
wildcard_imports = "deny"
wrong_self_convention = "warn"

[lints.rust]
missing_docs = "warn"
non_ascii_idents = "deny"
rust_2024_compatibility = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace]
resolver = "3"
