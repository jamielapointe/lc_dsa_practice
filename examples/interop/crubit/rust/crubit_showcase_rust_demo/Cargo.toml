[package]
name = "crubit_showcase_rust_demo"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
authors = ["Jamie LaPointe <jamielapointe@google.com>"]
publish = false

[workspace]

[[bin]]
name = "crubit_showcase_rust_demo"
path = "src/main.rs"

[dependencies]
cc_ownership_raii = "0.1.0"
cc_primitives_enums = "0.1.0"
cc_references_views = "0.1.0"
cc_telemetry_bridge = "0.1.0"
cc_traits_errors = "0.1.0"
cref = { path = "../../../../../build/crubit/src/cargo/support/cref" }
ctor = { path = "../../../../../build/crubit/src/cargo/support/ctor" }
ffi_11 = { path = "../../../../../build/crubit/src/support/ffi_11" }
rs_telemetry_validator = { path = "../../../../../src/rust/interop/crubit/rs_telemetry_validator" }

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
rust_2024_compatibility = { level = "warn", priority = -1 }
non_ascii_idents = "deny"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# `multiple_crate_versions` invokes `cargo metadata` without outer `--config patch.crates-io` flags.
multiple_crate_versions = "allow"
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
todo = "deny"
unimplemented = "deny"
wildcard_imports = "deny"
enum_glob_use = "deny"
clone_on_ref_ptr = "deny"
needless_pass_by_value = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
cast_lossless = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
undocumented_unsafe_blocks = "deny"
should_implement_trait = "warn"
new_without_default = "warn"
len_without_is_empty = "warn"
borrowed_box = "warn"
ptr_arg = "warn"
wrong_self_convention = "warn"
