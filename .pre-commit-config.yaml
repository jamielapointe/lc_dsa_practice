# =============================================================================
# lc_dsa_practice .pre-commit-config.yaml
#
# Hooks either come from pinned upstream repos or call `pixi run ...` so that
# every tool version is governed by pixi.lock (executed locally via `prek`).
# =============================================================================
default_install_hook_types: [pre-commit]
default_stages: [pre-commit]
default_language_version:
  python: python3.15
exclude: '^(\.agents/(scratch|swarm|teamwork|tmp|workflows)/|\.agent/|_agents/|_agent/|\.claude/|\.codex/|\.cursor/|\.gemini/|\.pixi/|\.rumdl_cache/|\.venv/|\.windsurf/|build/|data/|dist/|pixi\.lock$|uv\.lock$|\.mcp\.json$|CLAUDE\.md$|BRIEFING\.md$|DISPATCH\.md$|HANDOFF\.md$|ORIGINAL_REQUEST\.md$|PLAN\.md$|PROGRESS\.md$|PROJECT\.md$|SCOPE\.md$|TASK\.md$|TEST_INFRA\.md$|TEST_READY\.md$|WALKTHROUGH\.md$|handoff\.md$|implementation_plan\.md$|progress\.md$|task\.md$|walkthrough\.md$)'

repos:
  # ---------------------------------------------------------------------------
  # 1. Repository & File Hygiene (pre-commit-hooks v6.0.0)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
        exclude: '(^|/)tsconfig.*\.json$|\.jsonc$'
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: check-case-conflict
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-ast
      - id: debug-statements
      - id: check-vcs-permalinks
      - id: no-commit-to-branch
        args: ['--branch', 'main', '--branch', 'master']

  # ---------------------------------------------------------------------------
  # 2. CMake Formatting (gersemi, version pinned in pixi.lock)
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: gersemi
        name: format cmake files (gersemi)
        entry: pixi run gersemi -i
        language: system
        types: [cmake]
        pass_filenames: true

  # ---------------------------------------------------------------------------
  # 3. C++ Formatting (Google Style Guide, clang-format 23.1.4)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: 411d0309a2a80e90997f6f2596219563e21023a5 # frozen: v23.1.4
    hooks:
      - id: clang-format
        types_or: [c++, c]

  # ---------------------------------------------------------------------------
  # 4. Markdown Formatting & Linting (rumdl v0.3.4)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: df5a947a3af0dba56640e644c6b9316184749168 # frozen: v0.3.4
    hooks:
      - id: rumdl
        args: [--fix]
      - id: rumdl-fmt

  # ---------------------------------------------------------------------------
  # 5. Renovate Config Validation (renovatebot 44.239.1)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 6f9f6fb27042eeb2c12163c94cf22289e9710eda # frozen: 44.239.1
    hooks:
      - id: renovate-config-validator
        files: '^renovate\.jsonc?$'

  # ---------------------------------------------------------------------------
  # 6. Secret Scanning (gitleaks v8.30.1)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks
        args: ['--config=.gitleaks.toml']

  # ---------------------------------------------------------------------------
  # 7. Local Pixi Tasks (Ruff, Basedpyright, ty, deptry, Marimo, Tombi, Rust, Workflows)
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (pixi)
        entry: pixi run lint-fix
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format (pixi)
        entry: pixi run format
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: basedpyright
        name: basedpyright strict (pixi)
        entry: pixi run basedpyright
        language: system
        pass_filenames: false
        files: \.py$|^pyproject\.toml$|^pixi\.(toml|lock)$

      - id: ty
        name: ty check (pixi)
        entry: pixi run ty check
        language: system
        pass_filenames: false
        files: \.py$|^pyproject\.toml$|^pixi\.(toml|lock)$

      - id: deptry
        name: deptry dependency hygiene (pixi)
        entry: pixi run deptry .
        language: system
        pass_filenames: false
        files: \.py$|^pyproject\.toml$|^pixi\.(toml|lock)$

      - id: marimo-check
        name: marimo notebook DAG check (pixi)
        entry: pixi run marimo check --strict notebooks/
        language: system
        files: ^notebooks/.*\.py$
        pass_filenames: false

      - id: tombi
        name: Check and lint TOML files (tombi)
        entry: pixi run format-toml-check
        files: (^pyproject\.toml$|^pixi\.toml$|(^|/)Cargo\.toml$|^\.cargo/config\.toml$|^rustfmt\.toml$|^clippy\.toml$)
        language: system
        pass_filenames: false

      - id: cargo-fmt
        name: cargo fmt (pixi)
        entry: pixi run cargo fmt --all
        language: system
        files: '(^rustfmt\.toml$|\.rs$)'
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy (pixi)
        entry: pixi run cargo clippy --workspace --all-targets -- -D warnings
        language: system
        files: '((^|/)Cargo\.(toml|lock)$|^\.cargo/config\.toml$|^clippy\.toml$|\.rs$)'
        pass_filenames: false

      - id: systems-traceability
        name: Systems requirement <-> test traceability
        entry: pixi run check-traceability
        files: ^(docs/systems/.*\.md|test/(cpp|c|rust)/systems/.*_test\.(cpp|rs)|scripts/ci/check_systems_traceability\.py)$
        language: system
        pass_filenames: false

      - id: actionlint
        name: Lint GitHub Actions workflows (actionlint)
        entry: pixi run actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
        types: [yaml]
        pass_filenames: true

      - id: zizmor
        name: Security audit GitHub Actions (zizmor)
        entry: pixi run zizmor
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
        types: [yaml]
        pass_filenames: false
        args: ['--strict-collection', '--min-severity=low', '.github/workflows/']
