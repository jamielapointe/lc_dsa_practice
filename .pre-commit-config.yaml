# =============================================================================
# lc_dsa_practice .pre-commit-config.yaml
#
# Hooks either come from pinned upstream repos or call `pixi run ...` so that
# every tool version is governed by pixi.lock.
# =============================================================================
exclude: '^(\.agents/teamwork/|\.pixi/|\.rumdl_cache/|build/|dist/|pixi\.lock$)'

repos:
  # ---------------------------------------------------------------------------
  # 1. Repository & File Hygiene (pre-commit-hooks v6.0.0)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: check-case-conflict
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-ast
      - id: debug-statements

  # ---------------------------------------------------------------------------
  # 2. CMake Formatting (gersemi, version pinned in pixi.lock)
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: gersemi
        name: format cmake files (gersemi)
        entry: pixi run gersemi -i
        language: system
        types: [cmake]
        pass_filenames: true

  # ---------------------------------------------------------------------------
  # 3. C++ Formatting (Google Style Guide, clang-format 23.1.3)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: 98ad4ddb9c057de2f5b9e93e44e6db959807d68c # frozen: v23.1.3
    hooks:
      - id: clang-format
        types_or: [c++, c]

  # ---------------------------------------------------------------------------
  # 4. Markdown Formatting & Linting (rumdl v0.2.79)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: 3429bee0c8870bff7874f898c6e8659d1ffe9645 # frozen: v0.2.79
    hooks:
      - id: rumdl
        args: [--fix]
      - id: rumdl-fmt

  # ---------------------------------------------------------------------------
  # 5. Renovate Config Validation (renovatebot 44.144.1)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: e24b9d10fd52d2cd6c1377b74d12d2c99156c280 # frozen: 44.145.0
    hooks:
      - id: renovate-config-validator
        files: '^renovate\.jsonc?$'

  # ---------------------------------------------------------------------------
  # 6. Secret Scanning (gitleaks v8.30.1)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks
        args: ['--config=.gitleaks.toml']

  # ---------------------------------------------------------------------------
  # 7. Local Pixi Tasks (Ruff, Mypy, pyproject ordering, workflow security)
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (pixi)
        entry: pixi run lint-fix
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format (pixi)
        entry: pixi run format
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: mypy
        name: mypy (pixi)
        entry: pixi run typecheck
        language: system
        types: [python]
        require_serial: true
        pass_filenames: false

      - id: sort-pyproject-toml
        name: Check pyproject.toml ordering
        entry: pixi run check-pyproject
        files: ^pyproject\.toml$
        language: system
        pass_filenames: false

      - id: actionlint
        name: Lint GitHub Actions workflows (actionlint)
        entry: pixi run actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
        types: [yaml]
        pass_filenames: true

      - id: zizmor
        name: Security audit GitHub Actions (zizmor)
        entry: pixi run zizmor
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
        types: [yaml]
        pass_filenames: false
        args: ['.github/workflows/']
