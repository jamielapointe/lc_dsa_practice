exclude: 'build/'

repos:
  # ---------------------------------------------------------------------------
  # 1. Repository & File Hygiene
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-case-conflict
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-ast
      - id: check-json
      - id: debug-statements

  # ---------------------------------------------------------------------------
  # 2. CMake Formatting (Uses your .cmake-format.yaml)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/cheshirekow/cmake-format-precommit
    rev: v0.6.13
    hooks:
      - id: cmake-format
        additional_dependencies: [pyyaml]
        always_run: true
      - id: cmake-lint
        additional_dependencies: [pyyaml]
        always_run: true

  # ---------------------------------------------------------------------------
  # 2.5 CMake Configure (Generate compile_commands.json for Clang-Tidy)
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: cmake-build-test
        name: CMake Workflow (release)
        description: "Configure and compile the project using CMake presets"
        entry: cmake --workflow --preset dev-release
        language: system
        types_or: [c++, c, cmake]
        pass_filenames: false
        always_run: true

  # ---------------------------------------------------------------------------
  # 3. C++ Formatting & Static Analysis
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pocc/pre-commit-hooks
    rev: v1.4.0
    hooks:
      - id: clang-format
        types_or: [c++, c, cuda]
        args: ["-i"]

  # ---------------------------------------------------------------------------
  # 4. Python Linting & Formatting (Ruff matching pyproject.toml)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # ---------------------------------------------------------------------------
  # 4.5 Markdown Linting & Formatting (rumdl)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.2.77
    hooks:
      - id: rumdl
        args: [--fix]
      - id: rumdl-fmt

  # ---------------------------------------------------------------------------
  # 5. Local Runners (Type checking, Jupyter check, MathJax validation)
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: mypy
        name: mypy (uv)
        entry: uv run mypy
        language: system
        types: [python]
        require_serial: true
        pass_filenames: true
      - id: sort-pyproject-toml
        name: Organize and Sort pyproject.toml
        entry: uv run python scripts/ci/reorder_pyproject.py
        language: system
        files: pyproject\.toml
        pass_filenames: true
