[project]
dependencies = [
    "httpx>=0.27.0",
    "markdownify>=0.13.0",
    "mcp>=2.2.0",
    "pydantic>=2.0.0",
]
description = "MCP Python server for fetching LeetCode problem details, C++ starter templates, and test cases"
name = "leetcode-mcp"
readme = "README.md"
requires-python = ">=3.12"
version = "0.1.0"

[project.entry-points.pytest11]
leetcode_mcp = "leetcode_mcp.pytest_plugin"

[project.scripts]
leetcode-mcp = "leetcode_mcp.server:main"

[dependency-groups]
dev = [
    "mypy>=1.10.0",
    "pytest-asyncio>=0.23.0",
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[build-system]
build-backend = "hatchling.build"
requires = [
    "hatchling",
]

[tool.uv]
managed = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "UP",
    "W",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
markers = [
    "live: tests that make live network calls to LeetCode GraphQL API",
]
testpaths = [
    "tests",
]
