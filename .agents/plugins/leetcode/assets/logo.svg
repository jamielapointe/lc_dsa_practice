<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E24" />
      <stop offset="100%" stop-color="#0F0F12" />
    </linearGradient>
    <linearGradient id="lcGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA116" />
      <stop offset="100%" stop-color="#FF7A00" />
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#0080FF" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGradient)" stroke="#2D2D38" stroke-width="2" />

  <!-- Code Bracket Left < -->
  <path d="M42 42 L24 64 L42 86" fill="none" stroke="url(#lcGold)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Code Bracket Right > -->
  <path d="M86 42 L104 64 L86 86" fill="none" stroke="url(#lcGold)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- C++ Center Accent -->
  <path d="M52 64 L76 64" fill="none" stroke="url(#accentCyan)" stroke-width="6" stroke-linecap="round" />
  <path d="M64 52 L64 76" fill="none" stroke="url(#accentCyan)" stroke-width="6" stroke-linecap="round" />
  <circle cx="64" cy="64" r="3" fill="#FFFFFF" />
</svg>
